openapi: 3.1.0
info:
  title: Connecting Space API
  version: 0.1.0
  description: |
    커넥팅스페이스 MVP API 명세 초안이다.
    이 문서는 서버 구현 전에 프론트엔드와 백엔드가 공유할 계약이며,
    실제 운영 전 개인정보·계약서·AI 제공업체 정책을 별도로 검토한다.

servers:
  - url: https://api.example.invalid
    description: 실제 배포 전 임시 주소

tags:
  - name: 시스템
  - name: 공개 문의
  - name: 관리자 문의
  - name: 관리자 계약서
  - name: 고객 계약 승인
  - name: 관리자 프로젝트
  - name: 고객 진행상황
  - name: 관리자 이메일

paths:
  /health:
    get:
      tags: [시스템]
      summary: API 상태 확인
      operationId: getHealth
      description: 등록되지 않은 경로는 공통 `NOT_FOUND` 오류 응답을 반환한다.
      responses:
        '200':
          description: API가 요청을 처리할 수 있는 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /public/inquiries:
    post:
      tags: [공개 문의]
      summary: 견적 문의 제출
      operationId: createPublicInquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InquiryCreateInput'
      responses:
        '201':
          description: 문의 접수 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryCreatedResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '429':
          $ref: '#/components/responses/RateLimitError'

  /admin/summary:
    get:
      tags: [관리자 문의]
      summary: 관리자 요약 정보 조회
      operationId: getAdminSummary
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: 문의·프로젝트 상태별 개수
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSummary'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /admin/inquiries:
    get:
      tags: [관리자 문의]
      summary: 문의 목록 조회
      operationId: listInquiries
      security: [{ adminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/InquiryStatus'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/InquiryType'
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: 문의 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInquiries'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /admin/inquiries/{inquiryId}:
    parameters:
      - $ref: '#/components/parameters/InquiryId'
    get:
      tags: [관리자 문의]
      summary: 문의 상세 조회
      operationId: getInquiry
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: 문의 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryDetail'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags: [관리자 문의]
      summary: 문의 상태·메모 수정
      operationId: updateInquiry
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InquiryUpdateInput'
      responses:
        '200':
          description: 수정된 문의
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryDetail'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /admin/inquiries/{inquiryId}/contracts:
    post:
      tags: [관리자 계약서]
      summary: 계약서 초안 생성
      operationId: createContractDraft
      security: [{ adminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/InquiryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractCreateInput'
      responses:
        '201':
          description: 계약서 초안
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractVersion'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /admin/contracts/{contractId}:
    parameters:
      - $ref: '#/components/parameters/ContractId'
    get:
      tags: [관리자 계약서]
      summary: 계약서 버전 조회
      operationId: getContract
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: 계약서 버전
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractVersion'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags: [관리자 계약서]
      summary: 전송 전 계약서 수정
      operationId: updateContract
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractUpdateInput'
      responses:
        '200':
          description: 수정된 계약서
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractVersion'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          description: 이미 전송·승인된 계약서는 수정할 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/contracts/{contractId}/ai-draft:
    post:
      tags: [관리자 계약서]
      summary: AI 계약서 초안 생성
      operationId: generateContractAiDraft
      security: [{ adminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/ContractId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiDraftRequest'
      responses:
        '201':
          description: AI가 생성한 수정 가능 초안
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiDraftResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '503':
          description: AI 제공자 사용 불가
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /customer/contracts/{accessToken}:
    parameters:
      - $ref: '#/components/parameters/AccessToken'
    get:
      tags: [고객 계약 승인]
      summary: 고객 계약서 확인
      operationId: getCustomerContract
      responses:
        '200':
          description: 고객이 확인할 계약서
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerContractView'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '410':
          description: 만료·차단된 링크
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [고객 계약 승인]
      summary: 고객 계약서 승인
      operationId: approveCustomerContract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractApprovalInput'
      responses:
        '200':
          description: 승인 완료 및 프로젝트 조회 링크 발급
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractApprovalResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: 이미 승인되었거나 승인할 수 없는 계약서
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/contracts/{contractId}/send:
    post:
      tags: [관리자 이메일]
      summary: 계약서 링크 이메일 전송
      operationId: sendContractEmail
      security: [{ adminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/ContractId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailSendInput'
      responses:
        '201':
          description: 이메일 전송 기록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailDeliveryLog'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          description: 전송할 수 없는 계약서 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/projects:
    get:
      tags: [관리자 프로젝트]
      summary: 프로젝트 목록 조회
      operationId: listProjects
      security: [{ adminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ProjectStatus'
      responses:
        '200':
          description: 프로젝트 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjects'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /admin/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [관리자 프로젝트]
      summary: 프로젝트 상세 조회
      operationId: getProject
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: 프로젝트 상세와 진행 업데이트
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags: [관리자 프로젝트]
      summary: 프로젝트 상태·메모 수정
      operationId: updateProject
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdateInput'
      responses:
        '200':
          description: 수정된 프로젝트
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /admin/projects/{projectId}/updates:
    post:
      tags: [관리자 프로젝트]
      summary: 프로젝트 진행 업데이트 등록
      operationId: createProjectUpdate
      security: [{ adminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectProgressInput'
      responses:
        '201':
          description: 누적 진행 업데이트
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectProgressUpdate'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /customer/projects/{accessToken}:
    get:
      tags: [고객 진행상황]
      summary: 고객용 프로젝트 진행상황 조회
      operationId: getCustomerProjectProgress
      parameters:
        - $ref: '#/components/parameters/AccessToken'
      responses:
        '200':
          description: 읽기 전용 프로젝트 진행상황
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProjectView'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '410':
          description: 차단된 고객 링크
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/projects/{projectId}/access-links:
    post:
      tags: [관리자 프로젝트]
      summary: 고객용 프로젝트 링크 재발급
      operationId: reissueProjectAccessLink
      security: [{ adminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '201':
          description: 새 고객용 링크
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectAccessLink'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /admin/project-access-links/{linkId}/revoke:
    post:
      tags: [관리자 프로젝트]
      summary: 고객용 프로젝트 링크 차단
      operationId: revokeProjectAccessLink
      security: [{ adminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/LinkId'
      responses:
        '204':
          description: 링크 차단 완료
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /admin/projects/{projectId}/send-link:
    post:
      tags: [관리자 이메일]
      summary: 프로젝트 진행 링크 이메일 전송
      operationId: sendProjectLinkEmail
      security: [{ adminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailSendInput'
      responses:
        '201':
          description: 이메일 전송 기록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailDeliveryLog'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: CF_Authorization
      description: Cloudflare Access가 발급한 관리자 세션 쿠키를 실제 구현에서 검증한다.

  parameters:
    InquiryId:
      name: inquiryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ContractId:
      name: contractId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LinkId:
      name: linkId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AccessToken:
      name: accessToken
      in: path
      required: true
      schema: { type: string, minLength: 32 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status: { type: string, enum: [ok] }
        service: { type: string, enum: [api] }

    InquiryType:
      type: string
      enum:
        [
          견적 문의,
          홈페이지 제작 상담,
          기존 사이트 리뉴얼,
          유지보수·수정 문의,
          아임웹 제작 문의,
          자체 코드 제작 문의,
          기타,
        ]
    InquiryStatus:
      type: string
      enum: [신규, 상담 예정, 상담 완료, 보류]
    ProjectStatus:
      type: string
      enum: [준비 중, 제작 중, 고객 검수, 수정 중, 완료, 보류]
    ContractStatus:
      type: string
      enum: [작성 중, 전송됨, 승인됨, 만료됨, 취소됨]
    EmailType:
      type: string
      enum: [계약서 링크, 프로젝트 진행 링크]
    EmailDeliveryStatus:
      type: string
      enum: [전송 중, 전송 성공, 전송 실패]

    InquiryCreateInput:
      type: object
      required: [businessName, contactName, email, phone, type, message]
      properties:
        businessName: { type: string, minLength: 1, maxLength: 120 }
        contactName: { type: string, minLength: 1, maxLength: 80 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, minLength: 1, maxLength: 40 }
        type: { $ref: '#/components/schemas/InquiryType' }
        message: { type: string, minLength: 1, maxLength: 5000 }
        desiredSchedule: { type: string, maxLength: 120 }
        budget: { type: string, maxLength: 120 }
        currentSiteUrl: { type: string, format: uri, maxLength: 2048 }
        referenceSiteUrl: { type: string, format: uri, maxLength: 2048 }
        preferredContactMethod: { type: string, maxLength: 40 }

    InquiryCreatedResponse:
      type: object
      required: [id, status, receivedAt]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/InquiryStatus' }
        receivedAt: { type: string, format: date-time }

    InquiryUpdateInput:
      type: object
      properties:
        status: { $ref: '#/components/schemas/InquiryStatus' }
        adminMemo: { type: string, maxLength: 10000 }

    InquirySummary:
      type: object
      required: [id, businessName, contactName, type, status, receivedAt]
      properties:
        id: { type: string, format: uuid }
        businessName: { type: string }
        contactName: { type: string }
        type: { $ref: '#/components/schemas/InquiryType' }
        status: { $ref: '#/components/schemas/InquiryStatus' }
        receivedAt: { type: string, format: date-time }

    InquiryDetail:
      allOf:
        - $ref: '#/components/schemas/InquirySummary'
        - type: object
          properties:
            email: { type: string, format: email }
            phone: { type: string }
            message: { type: string }
            desiredSchedule: { type: string }
            budget: { type: string }
            currentSiteUrl: { type: string, format: uri }
            referenceSiteUrl: { type: string, format: uri }
            preferredContactMethod: { type: string }
            adminMemo: { type: string }
            contractId: { type: string, format: uuid, nullable: true }
            projectId: { type: string, format: uuid, nullable: true }

    ContractCreateInput:
      type: object
      required:
        [
          title,
          scope,
          totalAmount,
          schedule,
          revisionScope,
          paymentTerms,
          productionMethod,
        ]
      properties:
        title: { type: string, maxLength: 200 }
        scope: { type: string, maxLength: 10000 }
        totalAmount: { type: integer, minimum: 0 }
        schedule: { type: string, maxLength: 1000 }
        revisionScope: { type: string, maxLength: 2000 }
        paymentTerms: { type: string, maxLength: 2000 }
        productionMethod: { type: string, maxLength: 100 }
        externalCosts: { type: string, maxLength: 2000 }
        specialNotes: { type: string, maxLength: 5000 }

    ContractUpdateInput:
      allOf:
        - $ref: '#/components/schemas/ContractCreateInput'
        - type: object
          properties:
            body: { type: string, maxLength: 50000 }

    ContractVersion:
      type: object
      required: [id, inquiryId, version, status, body, createdAt]
      properties:
        id: { type: string, format: uuid }
        inquiryId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/ContractStatus' }
        body: { type: string }
        totalAmount: { type: integer, minimum: 0 }
        sentAt: { type: string, format: date-time, nullable: true }
        approvedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    AiDraftRequest:
      type: object
      required: [instructionVersionId]
      properties:
        instructionVersionId: { type: string, format: uuid }
        inputSnapshot:
          type: object
          additionalProperties: false
          properties:
            businessName: { type: string }
            productionMethod: { type: string }
            scope: { type: string }
            totalAmount: { type: integer, minimum: 0 }
            schedule: { type: string }
            paymentTerms: { type: string }
            revisionScope: { type: string }
            externalCosts: { type: string }

    AiDraftResponse:
      type: object
      required: [contract, model, instructionVersionId, generatedAt]
      properties:
        contract: { $ref: '#/components/schemas/ContractVersion' }
        model: { type: string }
        instructionVersionId: { type: string, format: uuid }
        generatedAt: { type: string, format: date-time }

    CustomerContractView:
      type: object
      required: [contractId, title, body, status]
      properties:
        contractId: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
        status: { type: string, enum: [승인 대기, 승인 완료] }
        totalAmount: { type: integer, minimum: 0 }
        schedule: { type: string }

    ContractApprovalInput:
      type: object
      required: [customerName, consent]
      properties:
        customerName: { type: string, minLength: 1, maxLength: 50 }
        consent: { type: boolean, const: true }

    ContractApprovalResponse:
      type: object
      required: [approvedAt, projectId, projectAccessToken]
      properties:
        approvedAt: { type: string, format: date-time }
        projectId: { type: string, format: uuid }
        projectAccessToken: { type: string, minLength: 32 }

    ProjectUpdateInput:
      type: object
      properties:
        status: { $ref: '#/components/schemas/ProjectStatus' }
        internalMemo: { type: string, maxLength: 10000 }

    ProjectProgressInput:
      type: object
      required: [status, message]
      properties:
        status: { $ref: '#/components/schemas/ProjectStatus' }
        message: { type: string, minLength: 1, maxLength: 5000 }

    ProjectProgressUpdate:
      type: object
      required: [id, projectId, status, message, createdAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        message: { type: string }
        createdAt: { type: string, format: date-time }

    ProjectDetail:
      type: object
      required: [id, inquiryId, contractId, name, status, updates]
      properties:
        id: { type: string, format: uuid }
        inquiryId: { type: string, format: uuid }
        contractId: { type: string, format: uuid }
        name: { type: string }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        productionMethod: { type: string }
        startDate: { type: string, format: date, nullable: true }
        expectedEndDate: { type: string, format: date, nullable: true }
        internalMemo: { type: string }
        updates:
          type: array
          items: { $ref: '#/components/schemas/ProjectProgressUpdate' }

    CustomerProjectView:
      type: object
      required: [projectName, status, updates, lastUpdatedAt]
      properties:
        projectName: { type: string }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        updates:
          type: array
          items:
            type: object
            required: [status, message, createdAt]
            properties:
              status: { $ref: '#/components/schemas/ProjectStatus' }
              message: { type: string }
              createdAt: { type: string, format: date-time }
        lastUpdatedAt: { type: string, format: date-time }

    ProjectAccessLink:
      type: object
      required: [id, projectId, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        token: { type: string, minLength: 32 }
        status: { type: string, enum: [활성, 차단] }
        createdAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time, nullable: true }

    EmailSendInput:
      type: object
      required: [recipientEmail, subject, body, confirmSend]
      properties:
        recipientEmail: { type: string, format: email }
        subject: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 20000 }
        confirmSend: { type: boolean, const: true }

    EmailDeliveryLog:
      type: object
      required: [id, type, recipientEmail, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/EmailType' }
        recipientEmail: { type: string, format: email }
        status: { $ref: '#/components/schemas/EmailDeliveryStatus' }
        providerMessageId: { type: string, nullable: true }
        errorMessage: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    AdminSummary:
      type: object
      required: [inquiries, projects]
      properties:
        inquiries:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        projects:
          type: object
          additionalProperties: { type: integer, minimum: 0 }

    PaginatedInquiries:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/InquirySummary' }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }

    PaginatedProjects:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ProjectDetail' }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details:
          type: object
          additionalProperties: true

  responses:
    ValidationError:
      description: 입력값 검증 실패
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UnauthorizedError:
      description: 관리자 인증 필요
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFoundError:
      description: 대상을 찾을 수 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ConflictError:
      description: 중복 또는 현재 상태에서 처리할 수 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimitError:
      description: 요청 한도 초과
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalError:
      description: 서버 내부 오류
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
